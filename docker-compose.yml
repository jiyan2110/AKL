name: akl

x-healthcheck-defaults: &hc_defaults
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 20s

x-airflow-env: &airflow_env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__PARALLELISM: "8"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
  AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-akl-dev-webserver-key}
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow_dev_change_me}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
  # akl settings for tasks (container network names; secrets come from .env)
  AKL_ENV: ${AKL_ENV:-dev}
  AKL_DB_HOST: postgres
  AKL_DB_PORT: "5432"
  AKL_DB_NAME: ${AKL_DB_NAME:-akl}
  AKL_DB_USER: ${AKL_DB_PIPELINE_USER:-akl_pipeline}
  AKL_DB_PASSWORD: ${AKL_DB_PIPELINE_PASSWORD:-${AKL_DB_PASSWORD:-}}
  AKL_S3_ENDPOINT: http://minio:9000
  AKL_S3_BUCKET: ${AKL_S3_BUCKET:-akl-lakehouse}
  AKL_S3_ACCESS_KEY: ${AKL_S3_ACCESS_KEY:-}
  AKL_S3_SECRET_KEY: ${AKL_S3_SECRET_KEY:-}
  AKL_QDRANT_URL: http://qdrant:6333
  AKL_MODELS_DIR: /models
  AKL_CONFIG_DIR: /opt/akl/configs
  AKL_JWT_SECRET: ${AKL_JWT_SECRET:-}
  AKL_EMBED_PROVIDER: ${AKL_EMBED_PROVIDER:-bge}

x-airflow-volumes: &airflow_volumes
  - ./airflow/dags:/opt/airflow/dags:ro
  - ./airflow/plugins:/opt/airflow/plugins:ro
  - ./airflow/config:/opt/airflow/config:ro
  - ./configs:/opt/akl/configs:ro
  - ./configs/dags:/opt/airflow/configs/dags:ro
  - ./akl:/opt/akl/akl:ro
  - akl_airflow_logs:/opt/airflow/logs
  - akl_models:/models

services:
  postgres:
    image: postgres:16-alpine
    container_name: akl-postgres
    ports:
      - "55432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      AKL_DB_NAME: ${AKL_DB_NAME:-akl}
      AKL_DB_API_USER: ${AKL_DB_API_USER:-akl_api}
      AKL_DB_API_PASSWORD: ${AKL_DB_API_PASSWORD:?AKL_DB_API_PASSWORD is required}
      AKL_DB_PIPELINE_USER: ${AKL_DB_PIPELINE_USER:-akl_pipeline}
      AKL_DB_PIPELINE_PASSWORD: ${AKL_DB_PIPELINE_PASSWORD:?AKL_DB_PIPELINE_PASSWORD is required}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER:-mlflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD is required}
    volumes:
      - akl_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [akl-data]
    healthcheck:
      <<: *hc_defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: akl-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    volumes: [akl_minio_data:/data]
    networks: [akl-data, akl-edge]
    healthcheck:
      <<: *hc_defaults
      test: ["CMD", "mc", "ready", "local"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: akl-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AKL_S3_BUCKET: ${AKL_S3_BUCKET:-akl-lakehouse}
      AKL_S3_ACCESS_KEY: ${AKL_S3_ACCESS_KEY:?AKL_S3_ACCESS_KEY is required}
      AKL_S3_SECRET_KEY: ${AKL_S3_SECRET_KEY:?AKL_S3_SECRET_KEY is required}
      AKL_QUARANTINE_RETENTION_DAYS: ${AKL_QUARANTINE_RETENTION_DAYS:-90}
      AKL_BACKUP_RETENTION_DAYS: ${AKL_BACKUP_RETENTION_DAYS:-14}
    volumes: [./docker/minio/init.sh:/scripts/init.sh:ro]
    networks: [akl-data]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: akl-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - akl_qdrant_data:/qdrant/storage
      - akl_qdrant_snapshots:/qdrant/snapshots
    networks: [akl-data]
    healthcheck:
      <<: *hc_defaults
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]

  # --------------------------------------------------------------------------- Airflow (PRD §7)
  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: akl-airflow:local
    container_name: akl-airflow-init
    entrypoint: ["bash", "/opt/airflow/config/init.sh"]
    environment:
      <<: *airflow_env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes: *airflow_volumes
    networks: [akl-data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-scheduler:
    image: akl-airflow:local
    container_name: akl-airflow-scheduler
    command: scheduler
    environment: *airflow_env
    volumes: *airflow_volumes
    networks: [akl-data]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *hc_defaults
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]

  airflow-webserver:
    image: akl-airflow:local
    container_name: akl-airflow-webserver
    ports:
      - "8080:8080"
    command: webserver
    environment: *airflow_env
    volumes: *airflow_volumes
    networks: [akl-data, akl-edge]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      <<: *hc_defaults
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]

  airflow-triggerer:
    image: akl-airflow:local
    container_name: akl-airflow-triggerer
    command: triggerer
    environment: *airflow_env
    volumes: *airflow_volumes
    networks: [akl-data]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  akl-edge:
    name: akl-edge
    driver: bridge
  akl-data:
    name: akl-data
    driver: bridge

volumes:
  akl_pg_data:
    name: akl_pg_data
  akl_minio_data:
    name: akl_minio_data
  akl_qdrant_data:
    name: akl_qdrant_data
  akl_qdrant_snapshots:
    name: akl_qdrant_snapshots
  akl_airflow_logs:
    name: akl_airflow_logs
  akl_models:
    name: akl_models
