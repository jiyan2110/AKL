[project]
name = "akl"
version = "0.1.0"
description = "Enterprise AI Knowledge Lakehouse — multi-source RAG platform on a Bronze/Silver/Gold lakehouse."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "AKL Maintainers" }]
keywords = ["lakehouse", "rag", "duckdb", "parquet", "qdrant", "airflow", "fastapi"]
classifiers = [
	"Programming Language :: Python :: 3.12",
	"Framework :: FastAPI",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
	"pydantic>=2.8,<3",
	"pydantic-settings>=2.4,<3",
	"structlog>=24.4",
	"typer>=0.12",
	"pyyaml>=6.0",
	"duckdb>=1.1,<2",
	"pyarrow>=17.0",
	"boto3>=1.35",
	"sqlalchemy>=2.0.35,<3",
	"alembic>=1.13",
	"psycopg[binary,pool]>=3.2",
	"markdown-it-py>=3.0",
	"mdit-py-plugins>=0.4",
	"pymupdf>=1.24",
	"selectolax>=0.3.21",
	"httpx>=0.27",
	"langdetect>=1.0.9",
	"tokenizers>=0.20",
	"pysbd>=0.3.4",
	"numpy>=1.26",
	"onnxruntime>=1.18",
	"huggingface-hub>=0.24",
	"qdrant-client>=1.12",
	"rank-bm25>=0.2.2",
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"python-multipart>=0.0.9",
	"pyjwt>=2.9",
	"prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
	"ruff>=0.6",
	"mypy>=1.11",
	"pytest>=8.3",
	"pytest-asyncio>=0.24",
	"pytest-cov>=5.0",
	"hypothesis>=6.112",
	"types-PyYAML>=6.0",
	"pre-commit>=3.8",
	"yamllint>=1.35",
]

[project.scripts]
akl-cli = "akl.cli.main:app"

[project.urls]
Documentation = "https://github.com/your-org/ai-knowledge-lakehouse/blob/main/PRD.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akl"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (PRD §13.3)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["akl", "tests", "airflow"]
extend-exclude = ["examples/notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "PT", "W"]
ignore = [
	"S101",  # assert is fine in tests and invariants
	"E501",  # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"airflow/dags/**" = ["N"]
"akl/api/schemas/common.py" = ["UP046"]
"akl/lakehouse/compaction.py" = ["S608"]  # object keys come from bucket listings, quoted per key
"akl/lakehouse/io.py" = ["S608"]           # DuckDB COPY targets built from settings/paths (quoted)
"akl/pipelines/maintenance.py" = ["S603"]  # pg_dump with a fixed argv list  # pydantic Generic[T] models (PEP 695 syntax not supported by the pydantic mypy plugin)

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls these in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body", "akl.api.deps.scoped", "akl.api.deps.rate_limited"]

[tool.ruff.lint.isort]
known-first-party = ["akl", "akl_airflow"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict on the akl package (PRD §13.3)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["akl"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["akl.ingestion.parsers.pdf"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["airflow.*", "duckdb.*", "qdrant_client.*", "rank_bm25.*", "fitz.*", "pdfplumber.*", "selectolax.*", "trafilatura.*", "markdown_it.*", "onnxruntime.*", "mlflow.*", "pyarrow.*", "boto3.*", "botocore.*", "pymupdf.*", "fitz.*", "selectolax.*", "langdetect.*", "mdit_py_plugins.*", "tokenizers.*", "pysbd.*", "onnxruntime.*", "huggingface_hub.*", "numpy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest — markers mirror PRD §12.1 test layers
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
	"ignore::SyntaxWarning:pysbd.*",
	"ignore:invalid escape sequence:SyntaxWarning",
	"ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
	"ignore::DeprecationWarning:starlette.testclient",
	"ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
	"ignore::DeprecationWarning:fastapi.testclient",
]
markers = [
	"unit: pure unit tests, no external services",
	"component: one module against a real dependency (Postgres/MinIO/Qdrant)",
	"integration: end-to-end against the Compose stack",
	"api: HTTP contract tests",
	"eval: retrieval/RAG quality evaluation",
	"slow: real model downloads or long-running",
	"airflow: DAG integrity tests (need an Airflow installation; run via make dags-test or CI)",
]

[tool.coverage.run]
source = ["akl"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
