[project]
name = "akl"
version = "0.1.0"
description = "Enterprise AI Knowledge Lakehouse — multi-source RAG platform on a Bronze/Silver/Gold lakehouse."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "AKL Maintainers" }]
keywords = ["lakehouse", "rag", "duckdb", "parquet", "qdrant", "airflow", "fastapi"]
classifiers = [
	"Programming Language :: Python :: 3.12",
	"Framework :: FastAPI",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
	"pydantic>=2.8,<3",
	"pydantic-settings>=2.4,<3",
	"structlog>=24.4",
	"typer>=0.12",
	"pyyaml>=6.0",
	"duckdb>=1.1,<2",
	"pyarrow>=17.0",
	"boto3>=1.35",
	"sqlalchemy>=2.0.35,<3",
	"alembic>=1.13",
	"psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
	"ruff>=0.6",
	"mypy>=1.11",
	"pytest>=8.3",
	"pytest-asyncio>=0.24",
	"pytest-cov>=5.0",
	"hypothesis>=6.112",
	"types-PyYAML>=6.0",
	"pre-commit>=3.8",
	"yamllint>=1.35",
]

[project.scripts]
akl-cli = "akl.cli.main:app"

[project.urls]
Documentation = "https://github.com/your-org/ai-knowledge-lakehouse/blob/main/PRD.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akl"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (PRD §13.3)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["akl", "tests", "airflow"]
extend-exclude = ["examples/notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "PT", "W"]
ignore = [
	"S101",  # assert is fine in tests and invariants
	"E501",  # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"airflow/dags/**" = ["N"]

[tool.ruff.lint.isort]
known-first-party = ["akl", "akl_airflow"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict on the akl package (PRD §13.3)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["akl"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["airflow.*", "duckdb.*", "qdrant_client.*", "rank_bm25.*", "fitz.*", "pdfplumber.*", "selectolax.*", "trafilatura.*", "markdown_it.*", "onnxruntime.*", "mlflow.*", "pyarrow.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest — markers mirror PRD §12.1 test layers
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
	"unit: pure unit tests, no external services",
	"component: one module against a real dependency (Postgres/MinIO/Qdrant)",
	"integration: end-to-end against the Compose stack",
	"api: HTTP contract tests",
	"eval: retrieval/RAG quality evaluation",
	"slow: real model downloads or long-running",
]

[tool.coverage.run]
source = ["akl"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
