core:
  env: dev
  service_name: akl-api
  log_level: INFO
  org_name: Example Org
  config_dir: configs
  models_dir: /models
  tmp_dir: /tmp/akl

database:
  host: postgres
  port: 5432
  name: akl
  user: akl_pipeline
  pool_min: 5
  pool_max: 20
  sslmode: disable

s3:
  endpoint: http://minio:9000
  region: us-east-1
  bucket: akl-lakehouse
  use_ssl: false
  path_style: true

qdrant:
  url: http://qdrant:6333
  grpc_port: 6334
  prefer_grpc: true
  collection_alias: kb_chunks
  collection: kb_chunks_v1

lakehouse:
  parquet_compression: ZSTD
  parquet_zstd_level: 3
  duckdb_memory_limit: 4GB
  duckdb_threads: 4
  lakehouse_use_file_manifest: false

embedding:
  embed_provider: bge          # bge (ONNX bge-small-en-v1.5) | hash (offline deterministic)
  embed_model_id: BAAI/bge-small-en-v1.5
  embed_model_version: "1.5"
  embed_dim: 384
  embed_device: auto
  embed_batch_size: 64
  embed_threads: 0
  embed_onnx_int8: false
  embed_task_shards: 4
  embedding_cache_ttl_days: 180
  embedding_retire_days: 30
  embedder_version: 1.0.0

retrieval:
  query_max_chars: 2000
  query_spell_dual: true
  retrieval_dense_k: 50
  retrieval_sparse_k: 50
  retrieval_fused_k: 40
  rrf_k: 60
  rag_top_k: 8
  rag_min_confidence: 0.35
  rag_min_candidates: 2
  rag_strong_confidence: 0.6
  qdrant_hnsw_ef: 128
  rerank_enabled: true
  rerank_model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_provider: onnx        # onnx | lexical | none
  rerank_top_n: 40
  rerank_onnx_int8: false
  rag_context_tokens: 3000
  rag_neighbor_expansion: 0
  rag_dedupe_jaccard: 0.85
  rag_soft_filter_penalty: 0.85
  rag_marginal_penalty: 0.9
  bm25_k1: 1.5
  bm25_b: 0.75

api:
  api_host: 0.0.0.0
  api_port: 8000
  api_workers: 2
  openapi_enabled: true
  auth_disabled: false        # dev only; set AKL_AUTH_DISABLED=true in .env for local use
  jwt_issuer: akl-local
  jwt_audience: akl-api
  jwt_ttl_s: 3600
  rate_limit_rpm: 120
  rate_limit_chat_rpm: 30
  max_upload_mb: 50

llm:
  llm_provider: none          # none (extractive answers) | openai_compat
  llm_base_url: http://host.docker.internal:11434/v1
  llm_model: ""
  llm_temperature: 0.1
  llm_max_input_tokens: 6000
  llm_max_output_tokens: 800
  llm_timeout_s: 60
  rag_history_turns: 3
  rag_summary_trigger_tokens: 1500
  rag_max_uncited_ratio: 0.2
  rag_strict: false
  conversation_ttl_days: 30
  prompt_version: answer_v1

observability:
  pushgateway_url: ""              # set to http://pushgateway:9091 to enable pipeline metrics push
  pushgateway_job: akl_pipelines
  otel_enabled: false
  otel_exporter_endpoint: http://otel-collector:4318/v1/traces
  otel_sample_ratio: 1.0
  lineage_enabled: true
  mlflow_enabled: false
  mlflow_tracking_uri: http://mlflow:5000
  mlflow_experiment: akl-embedding
  freshness_stale_after_minutes:
    akl_ingestion: 60
    akl_chunking: 90
    akl_embedding: 120
    akl_qdrant_sync: 120
