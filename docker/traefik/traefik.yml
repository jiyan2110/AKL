# Traefik static config (PRD §11.9): HTTP->HTTPS redirect, ACME (Let's Encrypt) or a self-signed
# dev cert via the dynamic file provider, Prometheus metrics for Traefik itself.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: akl-edge
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: ${AKL_ACME_EMAIL}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

api:
  dashboard: true
  insecure: false

metrics:
  prometheus:
    entryPoint: websecure

log:
  level: INFO
accessLog: {}
