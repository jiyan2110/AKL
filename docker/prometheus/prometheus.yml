# Prometheus scrape config (PRD §8.3). Batch tasks (Airflow) push to Pushgateway instead of being
# scraped; the API and Pushgateway are scraped normally.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: akl-api
    metrics_path: /metrics
    static_configs:
      # host.docker.internal resolves on Docker Desktop (Windows/Mac); on Linux add
      # `extra_hosts: ["host.docker.internal:host-gateway"]` to this service (already set below).
      - targets: ["host.docker.internal:8000"]
        labels: {service: akl-api}

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels: {service: akl-pipelines}

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
        labels: {service: qdrant}
