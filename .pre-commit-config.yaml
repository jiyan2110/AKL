# Pre-commit hooks mirroring CI (PRD §13.3). Install with: uv run pre-commit install
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/|\.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff runs from the project venv (uv) so hook and `make lint` always use the same version.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (uv run)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (uv run)
        entry: uv run ruff format
        language: system
        types: [python]

  # mypy runs from the project venv (uv) so it always sees the real dependency set.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: {max: 140}, document-start: disable, truthy: disable}}"]
