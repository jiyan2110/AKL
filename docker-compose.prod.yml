# Production overlay (PRD §11.9): API image behind Traefik with TLS; every data service loses its
# host port publication (compose.dev.yml's ports: are not applied here — see Makefile prod-up,
# which intentionally omits docker-compose.dev.yml). Combine as:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  traefik:
    image: traefik:v3.1
    container_name: akl-traefik
    restart: unless-stopped
    command: ["--configfile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      AKL_ACME_EMAIL: ${AKL_ACME_EMAIL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - akl_letsencrypt:/letsencrypt
    networks: [akl-edge]
    labels:
      - "traefik.enable=true"

  akl-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: akl-api:${AKL_VERSION:-latest}
    container_name: akl-api
    restart: unless-stopped
    environment:
      AKL_ENV: prod
      AKL_DB_HOST: postgres
      AKL_DB_PORT: "5432"
      AKL_DB_NAME: ${AKL_DB_NAME:-akl}
      AKL_DB_USER: ${AKL_DB_API_USER:-akl_api}
      AKL_DB_PASSWORD: ${AKL_DB_API_PASSWORD:-}
      AKL_DB_SSLMODE: ${AKL_DB_SSLMODE:-require}
      AKL_S3_ENDPOINT: http://minio:9000
      AKL_S3_BUCKET: ${AKL_S3_BUCKET:-akl-lakehouse}
      AKL_S3_ACCESS_KEY: ${AKL_S3_ACCESS_KEY:-}
      AKL_S3_SECRET_KEY: ${AKL_S3_SECRET_KEY:-}
      AKL_QDRANT_URL: http://qdrant:6333
      AKL_MODELS_DIR: /models
      AKL_JWT_SECRET: ${AKL_JWT_SECRET:?AKL_JWT_SECRET is required in prod}
      AKL_AUTH_DISABLED: "false"
      AKL_CORS_ORIGINS: ${AKL_CORS_ORIGINS:-}
      AKL_LLM_PROVIDER: ${AKL_LLM_PROVIDER:-none}
      AKL_LLM_BASE_URL: ${AKL_LLM_BASE_URL:-}
      AKL_LLM_MODEL: ${AKL_LLM_MODEL:-}
      AKL_LLM_API_KEY: ${AKL_LLM_API_KEY:-}
      AKL_PUSHGATEWAY_URL: ${AKL_PUSHGATEWAY_URL:-http://pushgateway:9091}
      AKL_OTEL_ENABLED: ${AKL_OTEL_ENABLED:-false}
      AKL_OTEL_EXPORTER_ENDPOINT: ${AKL_OTEL_EXPORTER_ENDPOINT:-http://otel-collector:4318/v1/traces}
    volumes:
      - akl_models:/models
    networks: [akl-data, akl-edge]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akl-api.rule=Host(`${AKL_API_HOST:-api.localhost}`)"
      - "traefik.http.routers.akl-api.entrypoints=websecure"
      - "traefik.http.routers.akl-api.tls=true"
      - "traefik.http.routers.akl-api.tls.certresolver=${AKL_TLS_RESOLVER:-letsencrypt}"
      - "traefik.http.services.akl-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.akl-api-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.akl-api-headers.headers.forceSTSHeader=true"
      - "traefik.http.routers.akl-api.middlewares=akl-api-headers"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akl-grafana.rule=Host(`${AKL_GRAFANA_HOST:-grafana.localhost}`)"
      - "traefik.http.routers.akl-grafana.entrypoints=websecure"
      - "traefik.http.routers.akl-grafana.tls=true"
      - "traefik.http.routers.akl-grafana.tls.certresolver=${AKL_TLS_RESOLVER:-letsencrypt}"
      - "traefik.http.services.akl-grafana.loadbalancer.server.port=3000"

  airflow-webserver:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akl-airflow.rule=Host(`${AKL_AIRFLOW_HOST:-airflow.localhost}`)"
      - "traefik.http.routers.akl-airflow.entrypoints=websecure"
      - "traefik.http.routers.akl-airflow.tls=true"
      - "traefik.http.routers.akl-airflow.tls.certresolver=${AKL_TLS_RESOLVER:-letsencrypt}"
      - "traefik.http.services.akl-airflow.loadbalancer.server.port=8080"

volumes:
  akl_letsencrypt:
    name: akl_letsencrypt
